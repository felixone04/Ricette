<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChefBox - Ricettario</title>
    
    <meta name="theme-color" content="#F97316">
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <style>
        :root {
            /* Nuovo tema Arancione */
            --primary: #F97316; 
            --primary-dark: #EA580C;
            --primary-light: rgba(249, 115, 22, 0.1);
            
            --bg-color: #FFF7ED; /* Panna/Arancione chiarissimo */
            --surface: #FFFFFF;
            --text-main: #1C1917;
            --text-muted: #78716C;
            --border: #FED7AA;
            --radius-md: 16px;
            --shadow-sm: 0 4px 12px rgba(249, 115, 22, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #E5E7EB; color: var(--text-main); display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        .app-container { width: 100%; max-width: 480px; background: var(--bg-color); height: 100vh; position: relative; display: flex; flex-direction: column; overflow: hidden; }

        header { padding: 24px 20px 16px; background: var(--surface); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        header h1 { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        
        /* Icona cucina personalizzata (Padella) */
        .kitchen-icon { width: 28px; height: 28px; display: inline-block; }

        .category-scroll { display: flex; overflow-x: auto; padding: 0 20px 16px; background: var(--surface); gap: 10px; scrollbar-width: none; border-bottom: 1px solid var(--border); }
        .category-scroll::-webkit-scrollbar { display: none; }
        .pill { padding: 8px 16px; background: var(--bg-color); border-radius: 20px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); white-space: nowrap; cursor: pointer; border: 1px solid transparent; transition: all 0.2s;}
        .pill.active { background: var(--primary); color: white; }

        /* WIDGET GRID - 2 COLONNE */
        .recipe-feed { 
            flex: 1; 
            overflow-y: auto; 
            padding: 16px; 
            padding-bottom: 120px; /* Spazio vitale per il FAB */
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
            align-content: start;
        }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 3rem; color: #FDBA74; }

        .recipe-widget {
            background: var(--surface);
            border-radius: var(--radius-md);
            padding: 16px;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            aspect-ratio: 1; /* Card quadrata perfetta */
            transition: transform 0.2s;
        }
        .recipe-widget:active { transform: scale(0.96); }
        
        .widget-title {
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3; 
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .widget-badge {
            background: var(--primary-light);
            color: var(--primary-dark);
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            align-self: flex-start;
            margin-top: 10px;
        }

        /* FAB Corretto con "+" SVG vettoriale centrato */
        .fab { 
            position: absolute; 
            bottom: 80px; 
            right: 24px; 
            width: 60px; 
            height: 60px; 
            background: var(--primary); 
            color: white; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            box-shadow: 0 8px 24px rgba(249, 115, 22, 0.4); 
            cursor: pointer; 
            border: none; 
            z-index: 20;
            transition: transform 0.2s;
        }
        .fab:active { transform: scale(0.9); }

        .overlay { position: absolute; top:0;left:0;right:0;bottom:0; background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: 0.3s; z-index: 30; }
        .overlay.active { opacity: 1; pointer-events: all; }
        .sheet, .detail-view { position: absolute; bottom: 0; left: 0; right: 0; background: var(--bg-color); height: 90vh; transform: translateY(100%); transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 40; display: flex; flex-direction: column; border-radius: 24px 24px 0 0;}
        .sheet.active { transform: translateY(0); }
        .detail-view { height: 100vh; transform: translateX(100%); border-radius: 0; z-index: 50;}
        .detail-view.active { transform: translateX(0); }
        .sheet-header, .detail-header { padding: 20px; background: var(--surface); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); border-radius: 24px 24px 0 0;}
        .detail-header { border-radius: 0; }
        .sheet-content, .detail-content { padding: 20px; overflow-y: auto; flex: 1; }
        
        .form-control { width: 100%; padding: 14px; margin-bottom: 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); font-family: inherit; font-size: 1rem; color: var(--text-main);}
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
        .time-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .btn-submit { width: 100%; padding: 16px; background: var(--text-main); color: white; border: none; border-radius: 12px; font-weight: 700; margin-bottom: 40px; cursor: pointer;}
        
        .detail-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 20px;}
        .time-banner { display: flex; justify-content: space-between; background: var(--surface); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border); margin-bottom: 20px;}
        .time-item span { display: block; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;}
        .time-item strong { font-size: 1.1rem; }
        .content-box { background: var(--surface); padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--border); white-space: pre-wrap; margin-bottom: 20px; line-height: 1.6;}
        
        .toast { position: absolute; top: 20px; left: 50%; transform: translate(-50%, -100px); background: var(--text-main); color: white; padding: 12px 24px; border-radius: 30px; font-weight: 600; transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 100; display: flex; align-items: center; gap: 8px; }
        .toast.show { transform: translate(-50%, 0); }
    </style>
</head>
<body>

<!-- Setup dinamico della PWA con l'icona Cucina Arancione (per evitare di creare file esterni) -->
<script>
    const iconSVG = `data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="1em" font-size="80">🍳</text></svg>`;
    const manifest = {
        name: "ChefBox",
        short_name: "ChefBox",
        display: "standalone",
        start_url: ".",
        background_color: "#FFF7ED",
        theme_color: "#F97316",
        icons: [{ src: iconSVG, sizes: "192x192", type: "image/svg+xml" }]
    };
    const manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(manifestLink);
</script>

<div class="app-container">
    <div id="toast" class="toast"><i class="ri-check-line"></i> <span id="toast-msg">Completato</span></div>

    <header>
        <h1>
            <!-- Icona Cucina Dinamica -->
            <img src='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="1em" font-size="80">🍳</text></svg>' class="kitchen-icon" alt="ChefBox"> 
            ChefBox
        </h1>
    </header>

    <div class="category-scroll" id="category-filters">
        <div class="pill active" data-filter="All">Tutte</div>
    </div>

    <!-- GRID A DUE COLONNE -->
    <main class="recipe-feed" id="recipe-feed"></main>

    <!-- FAB RIALZATO CON SIMBOLO "+" VETTORIALE PERFETTAMENTE CENTRATO -->
    <button class="fab" id="fab-add">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
    </button>

    <div class="overlay" id="overlay"></div>

    <!-- BOTTOM SHEET FORM -->
    <div class="sheet" id="add-sheet">
        <div class="sheet-header">
            <h3 style="font-size: 1.2rem;">Nuova Ricetta</h3>
            <button style="background:none;border:none;font-size:1.5rem;color:var(--text-muted);cursor:pointer;" id="btn-close-sheet"><i class="ri-close-line"></i></button>
        </div>
        <div class="sheet-content">
            <form id="recipe-form">
                <input type="text" class="form-control" id="title" required placeholder="Titolo (Es. Carbonara)">
                <select class="form-control" id="category" required><option value="" disabled selected>Scegli Categoria...</option></select>
                <div class="time-grid">
                    <input type="number" class="form-control" id="timeTotal" required placeholder="Tot(m)">
                    <input type="number" class="form-control" id="timeLeav" placeholder="Liev(m)">
                    <input type="number" class="form-control" id="timeCook" placeholder="Cott(m)">
                </div>
                <textarea class="form-control" id="ingredients" required placeholder="- Spaghetti&#10;- Guanciale&#10;- Uova..." style="height:100px;"></textarea>
                <textarea class="form-control" id="procedure" required placeholder="1. Metti l'acqua a bollire...&#10;2. Taglia il guanciale..." style="height:120px;"></textarea>
                <button type="submit" class="btn-submit">Salva Ricetta</button>
            </form>
        </div>
    </div>

    <!-- DETAIL VIEW -->
    <div class="detail-view" id="detail-view">
        <div class="detail-header">
            <button style="background:none;border:none;font-size:1.6rem;cursor:pointer;color:var(--text-main);" id="btn-back"><i class="ri-arrow-left-s-line"></i></button>
            <button style="background:var(--primary-light);color:var(--primary-dark);border:none;width:40px;height:40px;border-radius:50%;cursor:pointer;" id="btn-delete"><i class="ri-delete-bin-line"></i></button>
        </div>
        <div class="detail-content" id="detail-content"></div>
    </div>
</div>

<script>
    const Categorie = ["Antipasti", "Primi piatti", "Secondi piatti", "Contorni", "Dolci", "Lievitati salati", "Lievitati dolci", "Piatti unici", "Salse", "Zuppe", "Bevande", "Snack"];
    let recipes = JSON.parse(localStorage.getItem('chefbox_recipes_v2')) || [];
    let currentId = null;

    const feed = document.getElementById('recipe-feed'), filters = document.getElementById('category-filters');
    const form = document.getElementById('recipe-form'), catSelect = document.getElementById('category');
    
    // Inizializzazione
    Categorie.forEach(cat => {
        catSelect.add(new Option(cat, cat));
        const pill = document.createElement('div');
        pill.className = 'pill'; pill.innerText = cat;
        pill.onclick = () => {
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            pill.classList.add('active');
            renderFeed(cat);
        };
        filters.appendChild(pill);
    });

    document.querySelector('.pill').onclick = function() {
        document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
        this.classList.add('active'); renderFeed('All');
    }

    // Controlli Modali
    document.getElementById('fab-add').onclick = () => { document.getElementById('overlay').classList.add('active'); document.getElementById('add-sheet').classList.add('active'); }
    document.getElementById('btn-close-sheet').onclick = document.getElementById('overlay').onclick = () => { document.getElementById('overlay').classList.remove('active'); document.getElementById('add-sheet').classList.remove('active'); }
    document.getElementById('btn-back').onclick = () => document.getElementById('detail-view').classList.remove('active');

    // Salvataggio
    form.onsubmit = (e) => {
        e.preventDefault();
        recipes.unshift({
            id: 'r_' + Date.now(), title: document.getElementById('title').value, category: document.getElementById('category').value,
            timeTotal: document.getElementById('timeTotal').value, timeLeav: document.getElementById('timeLeav').value || '0', timeCook: document.getElementById('timeCook').value || '0',
            ingredients: document.getElementById('ingredients').value, procedure: document.getElementById('procedure').value
        });
        localStorage.setItem('chefbox_recipes_v2', JSON.stringify(recipes));
        form.reset(); document.getElementById('btn-close-sheet').click();
        document.querySelector('.pill').click(); 
        showToast('Ricetta aggiunta!');
    };

    // Rendering Griglia a Widget
    function renderFeed(filter = 'All') {
        feed.innerHTML = '';
        const filtered = filter === 'All' ? recipes : recipes.filter(r => r.category === filter);
        if(filtered.length === 0) return feed.innerHTML = `<div class="empty-state"><i class="ri-book-3-line"></i><br><span style="margin-top:10px; display:block;">Nessuna ricetta qui.</span></div>`;
        
        filtered.forEach(r => {
            const div = document.createElement('div');
            div.className = 'recipe-widget'; 
            div.onclick = () => openRecipe(r.id);
            div.innerHTML = `
                <div class="widget-title">${r.title}</div>
                <div class="widget-badge"><i class="ri-time-line"></i> ${r.timeTotal}m</div>
            `;
            feed.appendChild(div);
        });
    }

    // Apertura Lettura
    function openRecipe(id) {
        const r = recipes.find(rec => rec.id === id);
        currentId = id;
        document.getElementById('detail-content').innerHTML = `
            <div style="color:var(--primary); font-weight:bold; font-size:0.9rem; margin-bottom:10px; letter-spacing:0.5px;">${r.category.toUpperCase()}</div>
            <h2 class="detail-title">${r.title}</h2>
            <div class="time-banner">
                <div class="time-item"><span>Totale</span><strong>${r.timeTotal}m</strong></div>
                <div class="time-item"><span>Lievitaz.</span><strong>${r.timeLeav}m</strong></div>
                <div class="time-item"><span>Cottura</span><strong>${r.timeCook}m</strong></div>
            </div>
            <h3 style="margin-bottom:12px; display:flex; align-items:center; gap:8px;"><i class="ri-shopping-basket-line" style="color:var(--primary)"></i> Ingredienti</h3>
            <div class="content-box">${r.ingredients}</div>
            <h3 style="margin-bottom:12px; display:flex; align-items:center; gap:8px;"><i class="ri-list-check-2" style="color:var(--primary)"></i> Procedimento</h3>
            <div class="content-box">${r.procedure}</div>
        `;
        document.getElementById('detail-view').classList.add('active');
    }

    // Eliminazione
    document.getElementById('btn-delete').onclick = () => {
        recipes = recipes.filter(r => r.id !== currentId);
        localStorage.setItem('chefbox_recipes_v2', JSON.stringify(recipes));
        document.getElementById('btn-back').click();
        renderFeed(document.querySelector('.pill.active').innerText === 'Tutte' ? 'All' : document.querySelector('.pill.active').innerText);
        showToast('Ricetta eliminata');
    };

    // Toast
    function showToast(msg) {
        const t = document.getElementById('toast');
        document.getElementById('toast-msg').innerText = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    renderFeed();
</script>
</body>
</html>
