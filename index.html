<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ChefBox - Ricettario</title>
    
    <meta name="theme-color" content="#F97316">
    <!-- Collegamento REALE al Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-512.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #F97316; 
            --primary-dark: #EA580C;
            --primary-light: rgba(249, 115, 22, 0.1);
            --bg-color: #FFF7ED; 
            --surface: #FFFFFF;
            --text-main: #1C1917;
            --text-muted: #78716C;
            --border: #FED7AA;
            --radius-md: 12px;
            --shadow-sm: 0 4px 12px rgba(249, 115, 22, 0.05);
            --safe-bottom: env(safe-area-inset-bottom, 30px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #E5E7EB; color: var(--text-main); display: flex; justify-content: center; height: 100dvh; overflow: hidden; }
        .app-container { width: 100%; max-width: 480px; background: var(--bg-color); height: 100dvh; position: relative; display: flex; flex-direction: column; overflow: hidden; }

        header { padding: calc(24px + env(safe-area-inset-top, 0)) 20px 16px; background: var(--surface); display: flex; justify-content: space-between; align-items: center; z-index: 10; border-bottom: 1px solid var(--border);}
        header h1 { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 8px; color: var(--text-main); }
        .kitchen-icon { font-size: 26px; }
        .btn-icon { background: var(--bg-color); border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; color: var(--primary); transition: 0.2s; }
        
        .category-scroll { display: flex; overflow-x: auto; padding: 16px 20px; background: var(--surface); gap: 10px; scrollbar-width: none; border-bottom: 1px solid var(--border); }
        .category-scroll::-webkit-scrollbar { display: none; }
        .pill { padding: 8px 18px; background: var(--bg-color); border-radius: 20px; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; cursor: pointer; border: 1px solid transparent; transition: all 0.2s;}
        .pill.active { background: var(--primary); color: white; }

        .recipe-feed { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: calc(140px + var(--safe-bottom)); display: grid; grid-template-columns: repeat(2, 1fr); grid-auto-rows: max-content; gap: 12px; align-content: start; }
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 3.5rem; color: #FDBA74; margin-bottom:10px; display:block;}
        
        .recipe-widget { background: var(--surface); border-radius: var(--radius-md); padding: 14px; box-shadow: var(--shadow-sm); cursor: pointer; border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; min-height: 70px; transition: transform 0.2s; gap: 8px; }
        .recipe-widget:active { transform: scale(0.96); }
        .widget-title { font-size: 0.95rem; font-weight: 800; line-height: 1.3; width: 100%; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--text-main); }
        .widget-badge { background: var(--primary-light); color: var(--primary-dark); padding: 4px 8px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }

        .fab { position: absolute; bottom: calc(80px + var(--safe-bottom)); right: 24px; width: 64px; height: 64px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(249, 115, 22, 0.4); cursor: pointer; border: none; z-index: 30; transition: transform 0.2s; }
        .fab:active { transform: scale(0.9); }

        .detail-view { position: absolute; top: 0; left: 0; right: 0; background: var(--bg-color); height: 100dvh; transform: translateX(100%); transition: 0.3s ease; z-index: 40; display: flex; flex-direction: column;}
        .detail-view.active { transform: translateX(0); }
        .overlay { position: absolute; top:0;left:0;right:0;bottom:0; background: rgba(0,0,0,0.6); opacity: 0; pointer-events: none; transition: 0.3s; z-index: 50; }
        .overlay.active { opacity: 1; pointer-events: all; }
        .sheet { position: absolute; bottom: 0; left: 0; right: 0; background: var(--bg-color); height: 90dvh; transform: translateY(100%); transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 60; display: flex; flex-direction: column; border-radius: 24px 24px 0 0;}
        .sheet.active { transform: translateY(0); }
        
        .toast { position: absolute; top: 20px; left: 50%; transform: translate(-50%, -100px); background: var(--text-main); color: white; padding: 12px 24px; border-radius: 30px; font-weight: 700; transition: 0.3s; z-index: 100; display: flex; align-items: center; gap: 8px; width:max-content;}
        .toast.show { transform: translate(-50%, 0); }

        .sheet-header, .detail-header { padding: 16px 20px; background: var(--surface); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); border-radius: 24px 24px 0 0;}
        .detail-header { border-radius: 0; padding-top: calc(16px + env(safe-area-inset-top, 0)); }
        .sheet-content, .detail-content { padding: 20px; padding-bottom: calc(200px + var(--safe-bottom)); overflow-y: auto; flex: 1; }
        
        .form-section-title { font-size: 1.1rem; font-weight: 800; color: var(--primary-dark); margin-bottom: 12px; margin-top: 24px; display: flex; align-items: center; gap: 6px;}
        .form-section-title:first-child { margin-top: 0; }
        .form-section-title i { font-size: 1.3rem; }
        
        .form-group { background: var(--surface); padding: 16px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 16px; box-shadow: var(--shadow-sm);}
        .form-label { display: block; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-control { width: 100%; padding: 14px; border: 1px solid #E5E7EB; border-radius: 8px; background: var(--bg-color); font-family: inherit; font-size: 1rem; color: var(--text-main); margin-bottom: 12px; font-weight: 500;}
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); background: var(--surface);}
        textarea.form-control { resize: vertical; min-height: 100px; line-height: 1.5;}

        .checkbox-container { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 700; color: var(--text-main); font-size: 1rem; margin-bottom: 10px;}
        .checkbox-container input { width: 22px; height: 22px; accent-color: var(--primary); }
        .time-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 16px; display: none; padding-top: 16px; border-top: 1px dashed var(--border);}
        .time-grid.active { display: grid; }
        .time-grid-item label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 700; text-align: center;}
        .time-grid-item input { text-align: center; font-weight: 700;}

        .btn-submit { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 800; font-size: 1.1rem; margin-bottom: 10px; cursor: pointer; display:flex; justify-content:center; align-items:center; gap:8px; box-shadow: 0 4px 12px rgba(249, 115, 22, 0.2);}
        .btn-submit:active { transform: scale(0.98); }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); box-shadow: none;}
        .btn-install { background: #10B981; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
        
        .ing-labels { display: flex; gap: 6px; font-size: 0.75rem; color: var(--text-muted); font-weight: 700; margin-bottom: 6px; padding: 0 4px; text-transform: uppercase;}
        .ing-row { display: flex; gap: 6px; margin-bottom: 16px; }
        .ing-row input, .ing-row select { padding: 12px 8px; margin-bottom: 0;}
        .ing-row .btn-add-ing { background: var(--text-main); color: white; border: none; border-radius: 8px; width: 50px; display: flex; justify-content: center; align-items: center; font-size: 1.4rem; cursor: pointer; font-weight: bold;}
        
        .cat-list { list-style: none; margin-bottom: 10px; }
        .cat-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--bg-color); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; font-weight: 600; font-size:0.95rem;}
        .btn-del-cat { background: rgba(239, 68, 68, 0.1); color: #EF4444; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        .detail-title { font-size: 2rem; font-weight: 800; margin-bottom: 24px; line-height: 1.2;}
        .time-banner { display: flex; justify-content: space-around; background: var(--surface); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border); margin-bottom: 24px;}
        .time-item span { display: block; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 4px;}
        .time-item strong { font-size: 1.2rem; font-weight: 800;}
        
        .servings-stepper { display: flex; align-items: center; justify-content: space-between; background: var(--primary-light); padding: 16px; border-radius: var(--radius-md); margin-bottom: 16px; border: 1px solid var(--border);}
        .servings-stepper span { font-weight: 800; color: var(--primary-dark); font-size: 1rem; text-transform: uppercase;}
        .stepper-controls { display: flex; align-items: center; gap: 12px; }
        .stepper-btn { background: var(--surface); border: 2px solid var(--primary); color: var(--primary); width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; font-weight: bold;}
        .stepper-input { width: 50px; text-align: center; border: none; background: transparent; font-weight: 800; font-size: 1.2rem; color: var(--primary-dark); font-family: inherit;}
        
        .content-box { background: var(--surface); padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--border); white-space: pre-wrap; margin-bottom: 24px; line-height: 1.6; font-size: 1.05rem;}
        .ing-display-list { list-style: none; background: var(--surface); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border); margin-bottom: 24px; font-size: 1.05rem;}
        .ing-display-list li { padding: 12px 0; border-bottom: 1px dashed var(--border); display: flex; gap: 10px;}
        .ing-display-list li:last-child { border-bottom: none; padding-bottom: 0;}
        .ing-display-list li strong { color: var(--primary-dark); white-space: nowrap; font-weight: 800;}
    </style>
</head>
<body>

<div class="app-container">
    <div id="toast" class="toast"><i class="ri-check-line"></i> <span id="toast-msg">Completato</span></div>

    <header>
        <h1><span class="kitchen-icon">🍳</span> ChefBox</h1>
        <div class="header-actions">
            <button class="btn-icon" id="btn-open-settings"><i class="ri-settings-3-fill"></i></button>
        </div>
    </header>

    <div class="category-scroll" id="category-filters"></div>

    <main class="recipe-feed" id="recipe-feed"></main>

    <button class="fab" id="fab-add">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
    </button>

    <div class="overlay" id="overlay"></div>
    <datalist id="db-ingredients"></datalist>

    <!-- SHEET: INSERIMENTO / MODIFICA RICETTA -->
    <div class="sheet" id="add-sheet">
        <div class="sheet-header">
            <h3 style="font-size: 1.3rem; font-weight:800;" id="form-title">Nuova Ricetta</h3>
            <button type="button" class="btn-icon" style="color:var(--text-muted); background:var(--bg-color);" id="btn-close-sheet"><i class="ri-close-line"></i></button>
        </div>
        <div class="sheet-content">
            <form id="recipe-form">
                
                <div class="form-section-title"><i class="ri-information-line"></i> 1. Info Generali</div>
                <div class="form-group">
                    <label class="form-label" for="title">Nome della Ricetta</label>
                    <input type="text" class="form-control" id="title" required placeholder="Es. Torta di Mele">
                    
                    <label class="form-label" for="category">Categoria Gastronomica</label>
                    <select class="form-control" id="category" required></select>
                    
                    <label class="form-label" for="servings">Per quante persone è questa dose?</label>
                    <input type="number" class="form-control" id="servings" required placeholder="Es. 4" min="0.5" step="0.5" style="margin-bottom: 0;">
                </div>

                <div class="form-section-title"><i class="ri-timer-line"></i> 2. Tempi (Opzionale)</div>
                <div class="form-group">
                    <label class="checkbox-container">
                        <input type="checkbox" id="toggle-times"> Attiva i tempi
                    </label>
                    <div class="time-grid" id="time-grid-container">
                        <div class="time-grid-item"><label>Totale (min)</label><input type="number" class="form-control" id="timeTotal"></div>
                        <div class="time-grid-item"><label>Lievitazione</label><input type="number" class="form-control" id="timeLeav"></div>
                        <div class="time-grid-item"><label>Cottura (min)</label><input type="number" class="form-control" id="timeCook"></div>
                    </div>
                </div>
                
                <div class="form-section-title"><i class="ri-shopping-basket-line"></i> 3. Lista Ingredienti</div>
                <div class="form-group">
                    <div class="ing-labels">
                        <span style="flex:2;">Prodotto</span><span style="flex:1;">Q.tà</span><span style="flex:1;">Misura</span><span style="width:50px;"></span>
                    </div>
                    <div class="ing-row">
                        <input type="text" class="form-control" id="ing-name" list="db-ingredients" style="flex:2;">
                        <input type="number" step="0.1" class="form-control" id="ing-qty" style="flex:1; padding-right:2px;">
                        <select class="form-control" id="ing-unit" style="flex:1; padding-left:4px; padding-right:4px;">
                            <option value="g">g</option><option value="kg">kg</option><option value="ml">ml</option><option value="l">l</option><option value="pz">pz</option><option value="q.b.">q.b.</option><option value="">-</option>
                        </select>
                        <button type="button" class="btn-add-ing" id="btn-add-ing"><i class="ri-add-line"></i></button>
                    </div>
                    <ul class="cat-list" id="current-ing-list"></ul>
                </div>
                
                <div class="form-section-title"><i class="ri-list-check-2"></i> 4. Come si prepara</div>
                <div class="form-group">
                    <textarea class="form-control" id="procedure" required placeholder="Descrivi qui..." style="margin-bottom:0; height:150px;"></textarea>
                </div>
                
                <button type="submit" class="btn-submit" id="btn-save-recipe"><i class="ri-save-3-line"></i> Salva Ricetta</button>
            </form>
        </div>
    </div>

    <!-- SHEET: IMPOSTAZIONI -->
    <div class="sheet" id="settings-sheet">
        <div class="sheet-header">
            <h3 style="font-size: 1.2rem;">Impostazioni</h3>
            <button type="button" class="btn-icon" style="color:var(--text-muted); background:var(--bg-color);" id="btn-close-settings"><i class="ri-close-line"></i></button>
        </div>
        <div class="sheet-content">
            
            <!-- TASTO INSTALLAZIONE PWA (Compare solo se il telefono lo permette) -->
            <button type="button" class="btn-submit btn-install" id="btn-install" style="display:none; margin-bottom: 20px;">
                <i class="ri-download-cloud-2-line"></i> Installa App sul Telefono
            </button>

            <div class="form-group">
                <label class="form-label">Crea Nuova Categoria</label>
                <div style="display:flex; gap:8px; margin-bottom:10px;">
                    <input type="text" class="form-control" id="new-cat-name" placeholder="Es. Vegano..." style="margin-bottom:0;">
                    <button type="button" class="btn-submit" id="btn-add-cat" style="width:auto; margin:0; padding:14px 20px;">+</button>
                </div>
                <div style="max-height: 200px; overflow-y:auto;"><ul class="cat-list" id="cat-list-ui"></ul></div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Database Prodotti</label>
                <div style="display:flex; gap:8px; margin-bottom:10px;">
                    <input type="text" class="form-control" id="new-prod-name" placeholder="Nuovo prodotto..." style="margin-bottom:0;">
                    <button type="button" class="btn-submit" id="btn-add-prod" style="width:auto; margin:0; padding:14px 20px;">+</button>
                </div>
                <div style="max-height: 200px; overflow-y:auto;"><ul class="cat-list" id="prod-list-ui"></ul></div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Backup Dati</label>
                <button type="button" class="btn-submit btn-outline" id="btn-export"><i class="ri-download-2-line"></i> Esporta Dati</button>
                <label for="file-import" class="btn-submit btn-outline" style="cursor:pointer; margin-bottom:0;"><i class="ri-upload-2-line"></i> Ripristina Dati</label>
                <input type="file" id="file-import" accept=".json" style="display:none;">
            </div>
        </div>
    </div>

    <!-- DETAIL VIEW (Lettura Ricetta) -->
    <div class="detail-view" id="detail-view">
        <div class="detail-header">
            <button type="button" style="background:none;border:none;font-size:2rem;cursor:pointer;color:var(--text-main);" id="btn-back"><i class="ri-arrow-left-s-line"></i></button>
            <div style="display:flex; gap:12px;">
                <button type="button" class="btn-icon" style="background:var(--primary-light);color:var(--primary-dark);" id="btn-edit"><i class="ri-pencil-line"></i></button>
                <button type="button" class="btn-icon" style="background:rgba(239,68,68,0.1);color:#EF4444;" id="btn-delete"><i class="ri-delete-bin-line"></i></button>
            </div>
        </div>
        <div class="detail-content" id="detail-content"></div>
    </div>
</div>

<script>
    // --- REGISTRAZIONE SERVICE WORKER (PWA) ---
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW registrato!', reg))
                .catch(err => console.log('Errore SW:', err));
        });
    }

    // --- LOGICA PULSANTE INSTALLAZIONE ---
    let deferredPrompt;
    const btnInstall = document.getElementById('btn-install');

    window.addEventListener('beforeinstallprompt', (e) => {
        // Previene l'avviso standard
        e.preventDefault();
        deferredPrompt = e;
        // Mostra il nostro bottone personalizzato nelle impostazioni
        btnInstall.style.display = 'flex';
    });

    btnInstall.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                btnInstall.style.display = 'none';
            }
            deferredPrompt = null;
        }
    });

    // --- DATI INIZIALI ---
    let defaultCats = ["Antipasti", "Primi", "Secondi", "Contorni", "Dolci", "Lievitati", "Salse", "Bevande"];
    let defaultProds = ["Farina 00", "Zucchero", "Uova", "Latte", "Burro", "Sale", "Olio EVO", "Lievito", "Aglio", "Cipolla"];
    let categories = JSON.parse(localStorage.getItem('chefbox_cats')) || defaultCats;
    let productsDB = JSON.parse(localStorage.getItem('chefbox_products')) || defaultProds;
    let recipes = JSON.parse(localStorage.getItem('chefbox_recipes_v6')) || [];
    
    let currentRecipeId = null, isEditing = false, activeIngredients = [], currentBaseServings = 1, currentTargetServings = 1, currentDetailIngredients = [];

    const feed = document.getElementById('recipe-feed'), filters = document.getElementById('category-filters'), catSelect = document.getElementById('category');
    
    // --- GESTIONE SCHERMATE SICURA ---
    function openModal(id) { document.getElementById(id).classList.add('active'); if(id.includes('sheet')) document.getElementById('overlay').classList.add('active'); history.pushState({ modal: id }, "", `#${id}`); }
    function closeSheetManually() { document.getElementById('add-sheet').classList.remove('active'); document.getElementById('settings-sheet').classList.remove('active'); document.getElementById('overlay').classList.remove('active'); history.back(); }
    function closeAllModals() { document.querySelectorAll('.sheet, .detail-view, .overlay').forEach(el => el.classList.remove('active')); }
    
    window.addEventListener('popstate', (e) => { closeAllModals(); if (e.state && e.state.modal) { document.getElementById(e.state.modal).classList.add('active'); if(e.state.modal.includes('sheet')) document.getElementById('overlay').classList.add('active'); }});
    const triggerBack = () => { history.back(); };
    
    document.getElementById('btn-close-sheet').onclick = document.getElementById('btn-close-settings').onclick = document.getElementById('btn-back').onclick = document.getElementById('overlay').onclick = triggerBack;
    document.getElementById('btn-open-settings').onclick = () => openModal('settings-sheet');
    
    document.getElementById('toggle-times').addEventListener('change', function() {
        document.getElementById('time-grid-container').classList.toggle('active', this.checked);
        if(!this.checked) { document.getElementById('timeTotal').value = ''; document.getElementById('timeLeav').value = ''; document.getElementById('timeCook').value = ''; }
    });

    // --- DB PRODOTTI E CATEGORIE ---
    function renderProducts() {
        const datalist = document.getElementById('db-ingredients'); const prodUI = document.getElementById('prod-list-ui');
        datalist.innerHTML = ''; prodUI.innerHTML = '';
        productsDB.sort((a,b) => a.localeCompare(b)).forEach(p => {
            datalist.appendChild(new Option(p, p));
            const li = document.createElement('li'); li.className = 'cat-item'; li.innerHTML = `<span>${p}</span>`;
            const delBtn = document.createElement('button'); delBtn.className = 'btn-del-cat'; delBtn.type="button"; delBtn.innerHTML = '<i class="ri-delete-bin-line"></i>';
            delBtn.onclick = () => { productsDB = productsDB.filter(x => x !== p); saveProducts(); }; li.appendChild(delBtn); prodUI.appendChild(li);
        });
    }
    function saveProducts() { localStorage.setItem('chefbox_products', JSON.stringify(productsDB)); renderProducts(); }
    document.getElementById('btn-add-prod').onclick = () => { const val = document.getElementById('new-prod-name').value.trim(); if(val && !productsDB.map(v=>v.toLowerCase()).includes(val.toLowerCase())) { productsDB.push(val); saveProducts(); document.getElementById('new-prod-name').value = ''; showToast('Prodotto aggiunto'); }};
    function autoAddProduct(name) { if(name && !productsDB.map(v=>v.toLowerCase()).includes(name.toLowerCase())) { productsDB.push(name); saveProducts(); } }

    function renderCategories() {
        filters.innerHTML = '<div class="pill active" data-filter="All">Tutte</div>'; catSelect.innerHTML = '<option value="" disabled selected>Scegli Categoria...</option>'; document.getElementById('cat-list-ui').innerHTML = '';
        categories.forEach(cat => {
            catSelect.add(new Option(cat, cat));
            const pill = document.createElement('div'); pill.className = 'pill'; pill.innerText = cat;
            pill.onclick = () => { document.querySelectorAll('.pill').forEach(p => p.classList.remove('active')); pill.classList.add('active'); renderFeed(cat); }; filters.appendChild(pill);
            const li = document.createElement('li'); li.className = 'cat-item'; li.innerHTML = `<span>${cat}</span>`;
            const delBtn = document.createElement('button'); delBtn.className = 'btn-del-cat'; delBtn.type="button"; delBtn.innerHTML = '<i class="ri-delete-bin-line"></i>';
            delBtn.onclick = () => {
                const count = recipes.filter(r => r.category === cat).length;
                if(count > 0 && !delBtn.classList.contains('confirming')) { delBtn.classList.add('confirming'); delBtn.innerHTML = 'Elimina ' + count + ' ricette?'; setTimeout(() => { delBtn.classList.remove('confirming'); delBtn.innerHTML = '<i class="ri-delete-bin-line"></i>'; }, 3000); return; }
                else if(count > 0) { recipes = recipes.filter(r => r.category !== cat); localStorage.setItem('chefbox_recipes_v6', JSON.stringify(recipes)); renderFeed('All'); }
                categories = categories.filter(c => c !== cat); localStorage.setItem('chefbox_cats', JSON.stringify(categories)); renderCategories(); showToast('Categoria rimossa');
            }; li.appendChild(delBtn); document.getElementById('cat-list-ui').appendChild(li);
        });
        filters.firstElementChild.onclick = function() { document.querySelectorAll('.pill').forEach(p => p.classList.remove('active')); this.classList.add('active'); renderFeed('All'); }
    }
    document.getElementById('btn-add-cat').onclick = () => { const val = document.getElementById('new-cat-name').value.trim(); if(val && !categories.includes(val)) { categories.push(val); localStorage.setItem('chefbox_cats', JSON.stringify(categories)); document.getElementById('new-cat-name').value = ''; renderCategories(); showToast('Categoria aggiunta!'); }};

    // --- COSTRUTTORE INGREDIENTI ---
    function renderActiveIngredients() {
        const ul = document.getElementById('current-ing-list'); ul.innerHTML = '';
        activeIngredients.forEach((ing, index) => {
            const li = document.createElement('li'); li.className = 'cat-item'; li.style.padding = '8px 12px';
            li.innerHTML = `<span><strong style="color:var(--primary-dark);">${ing.qty} ${ing.unit}</strong> ${ing.name}</span>`;
            const del = document.createElement('button'); del.className = 'btn-del-cat'; del.type="button"; del.style.padding = '4px 8px'; del.innerHTML = '<i class="ri-close-line"></i>';
            del.onclick = () => { activeIngredients.splice(index, 1); renderActiveIngredients(); }; li.appendChild(del); ul.appendChild(li);
        });
    }
    document.getElementById('btn-add-ing').onclick = () => {
        const name = document.getElementById('ing-name').value.trim();
        const qty = document.getElementById('ing-qty').value.replace(',', '.').trim();
        const unit = document.getElementById('ing-unit').value;
        if(!name) return showToast("Inserisci il nome del prodotto!");
        activeIngredients.push({ name, qty, unit }); autoAddProduct(name);
        document.getElementById('ing-name').value = ''; document.getElementById('ing-qty').value = ''; document.getElementById('ing-name').focus();
        renderActiveIngredients();
    };

    // --- SALVATAGGIO ---
    document.getElementById('fab-add').onclick = () => {
        isEditing = false; document.getElementById('form-title').innerText = "Nuova Ricetta"; document.getElementById('recipe-form').reset();
        document.getElementById('servings').value = 4; document.getElementById('toggle-times').checked = false; document.getElementById('time-grid-container').classList.remove('active');
        activeIngredients = []; renderActiveIngredients(); openModal('add-sheet');
    };

    document.getElementById('recipe-form').onsubmit = (e) => {
        e.preventDefault();
        const pendName = document.getElementById('ing-name').value; if(pendName) document.getElementById('btn-add-ing').click();
        if(activeIngredients.length === 0) { alert("Attenzione: Aggiungi almeno un ingrediente cliccando sul tasto '+' nella riga apposita."); return; }

        const recData = {
            id: isEditing ? currentRecipeId : ('r_' + Date.now()), 
            title: document.getElementById('title').value, category: document.getElementById('category').value,
            servings: parseFloat(document.getElementById('servings').value) || 1,
            timeTotal: document.getElementById('timeTotal').value, timeLeav: document.getElementById('timeLeav').value, timeCook: document.getElementById('timeCook').value,
            ingredients: JSON.parse(JSON.stringify(activeIngredients)), procedure: document.getElementById('procedure').value
        };

        if(isEditing) {
            recipes[recipes.findIndex(r => r.id === currentRecipeId)] = recData; localStorage.setItem('chefbox_recipes_v6', JSON.stringify(recipes));
            refreshDetailView(currentRecipeId); closeSheetManually(); showToast('Ricetta modificata!');
        } else { 
            recipes.unshift(recData); localStorage.setItem('chefbox_recipes_v6', JSON.stringify(recipes)); closeSheetManually(); showToast('Ricetta salvata!');
        }
        setTimeout(() => { renderFeed(document.querySelector('.pill.active').innerText === 'Tutte' ? 'All' : document.querySelector('.pill.active').innerText); }, 50);
    };

    // --- FEED ---
    function renderFeed(filter = 'All') {
        feed.innerHTML = '';
        const filtered = filter === 'All' ? recipes : recipes.filter(r => r.category === filter);
        if(filtered.length === 0) return feed.innerHTML = `<div class="empty-state"><i class="ri-book-3-line"></i><br><span style="margin-top:10px; display:block;">Nessuna ricetta qui.</span></div>`;
        filtered.forEach(r => {
            const div = document.createElement('div'); div.className = 'recipe-widget'; div.onclick = () => openRecipe(r.id);
            const badgeHtml = r.timeTotal ? `<div class="widget-badge"><i class="ri-time-line"></i> ${r.timeTotal}m</div>` : '';
            div.innerHTML = `<div class="widget-title">${r.title}</div>${badgeHtml}`; feed.appendChild(div);
        });
    }

    // --- DETTAGLIO RICETTA E PORZIONI ---
    function renderDetailIngredientsHTML() {
        const ratio = currentTargetServings / currentBaseServings;
        let html = `<ul class="ing-display-list">`;
        currentDetailIngredients.forEach(i => {
            let displayQty = i.qty;
            if(displayQty && displayQty !== '') {
                let parsed = parseFloat(displayQty);
                if(!isNaN(parsed)) displayQty = +(parsed * ratio).toFixed(2);
            }
            html += `<li><strong>${displayQty} ${i.unit}</strong> ${i.name}</li>`;
        });
        html += `</ul>`; document.getElementById('dynamic-ingredients-box').innerHTML = html;
    }

    window.changeServings = function(delta) {
        let newVal = currentTargetServings + delta; if(newVal < 0.5) newVal = 0.5;
        currentTargetServings = newVal; document.getElementById('detail-servings').value = currentTargetServings;
        renderDetailIngredientsHTML();
    }

    function refreshDetailView(id) {
        const r = recipes.find(rec => rec.id === id);
        currentBaseServings = r.servings || 1; currentTargetServings = currentBaseServings;
        currentDetailIngredients = Array.isArray(r.ingredients) ? r.ingredients : [];

        let timeBannerHtml = '';
        if(r.timeTotal || r.timeLeav || r.timeCook) {
            timeBannerHtml = `<div class="time-banner">`;
            if(r.timeTotal) timeBannerHtml += `<div class="time-item"><span>Totale</span><strong>${r.timeTotal}m</strong></div>`;
            if(r.timeLeav) timeBannerHtml += `<div class="time-item"><span>Lievitaz.</span><strong>${r.timeLeav}m</strong></div>`;
            if(r.timeCook) timeBannerHtml += `<div class="time-item"><span>Cottura</span><strong>${r.timeCook}m</strong></div>`;
            timeBannerHtml += `</div>`;
        }

        document.getElementById('detail-content').innerHTML = `
            <div style="color:var(--primary); font-weight:800; font-size:0.95rem; margin-bottom:10px; letter-spacing:1px; text-transform:uppercase;">${r.category}</div>
            <h2 class="detail-title">${r.title}</h2>
            ${timeBannerHtml}
            <div class="form-section-title"><i class="ri-restaurant-line"></i> Dosi</div>
            <div class="servings-stepper">
                <span>Persone</span>
                <div class="stepper-controls">
                    <button type="button" class="stepper-btn" onclick="changeServings(-0.5)">-</button>
                    <input type="number" id="detail-servings" class="stepper-input" step="0.5" min="0.5" value="${currentTargetServings}">
                    <button type="button" class="stepper-btn" onclick="changeServings(0.5)">+</button>
                </div>
            </div>
            <div id="dynamic-ingredients-box"></div>
            <div class="form-section-title"><i class="ri-list-check-2"></i> Preparazione</div>
            <div class="content-box">${r.procedure}</div>
        `;
        if(currentDetailIngredients.length > 0) renderDetailIngredientsHTML();
        document.getElementById('detail-servings').addEventListener('input', (e) => { let val = parseFloat(e.target.value); if(val && val >= 0.5) { currentTargetServings = val; renderDetailIngredientsHTML(); } });
    }

    function openRecipe(id) {
        currentRecipeId = id; refreshDetailView(id);
        if(!document.getElementById('detail-view').classList.contains('active')) { openModal('detail-view'); }
    }

    document.getElementById('btn-edit').onclick = () => {
        const r = recipes.find(rec => rec.id === currentRecipeId); isEditing = true; 
        document.getElementById('form-title').innerText = "Modifica Ricetta";
        document.getElementById('title').value = r.title; document.getElementById('category').value = r.category;
        document.getElementById('servings').value = r.servings || 1;
        document.getElementById('timeTotal').value = r.timeTotal || ''; document.getElementById('timeLeav').value = r.timeLeav || ''; document.getElementById('timeCook').value = r.timeCook || '';
        document.getElementById('procedure').value = r.procedure;
        
        const hasTimes = !!(r.timeTotal || r.timeLeav || r.timeCook);
        document.getElementById('toggle-times').checked = hasTimes; document.getElementById('time-grid-container').classList.toggle('active', hasTimes);
        activeIngredients = Array.isArray(r.ingredients) ? JSON.parse(JSON.stringify(r.ingredients)) : []; renderActiveIngredients();
        openModal('add-sheet'); 
    };

    document.getElementById('btn-delete').onclick = () => {
        if(confirm("Sei sicuro di voler eliminare questa ricetta per sempre?")) { recipes = recipes.filter(r => r.id !== currentRecipeId); localStorage.setItem('chefbox_recipes_v6', JSON.stringify(recipes)); triggerBack(); renderFeed(document.querySelector('.pill.active').innerText === 'Tutte' ? 'All' : document.querySelector('.pill.active').innerText); showToast('Ricetta eliminata'); }
    };

    // --- EXPORT/IMPORT ---
    document.getElementById('btn-export').onclick = () => {
        const dlAnchor = document.createElement('a'); dlAnchor.setAttribute("href", "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(recipes)));
        dlAnchor.setAttribute("download", "chefbox_backup.json"); dlAnchor.click(); showToast("Backup scaricato!");
    };
    document.getElementById('file-import').onchange = (e) => {
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            try { const importedRecipes = JSON.parse(event.target.result); if(Array.isArray(importedRecipes)) {
                    const existingIds = new Set(recipes.map(r => r.id)); importedRecipes.forEach(r => { if(!existingIds.has(r.id)) recipes.push(r); });
                    localStorage.setItem('chefbox_recipes_v6', JSON.stringify(recipes)); triggerBack(); renderFeed('All'); showToast("Ricette importate!");
                }
            } catch(err) { alert("Errore file. Assicurati sia un backup valido."); }
        }; reader.readAsText(file);
    };

    function showToast(msg) { const t = document.getElementById('toast'); document.getElementById('toast-msg').innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }

    // Start
    renderCategories(); renderProducts(); renderFeed();
</script>
</body>
</html>
