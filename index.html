<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChefBox - Ricettario</title>
    
    <!-- PWA Config (Dinamica via JS per l'anteprima) -->
    <link id="manifest-link" rel="manifest" href="">
    <meta name="theme-color" content="#FF6B6B">
    <link rel="apple-touch-icon" href="https://placehold.co/192x192/FF6B6B/FFFFFF?text=CB">
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #FF6B6B;
            --primary-dark: #FA5252;
            --bg-color: #F8F9FA;
            --surface: #FFFFFF;
            --text-main: #2B303A;
            --text-muted: #868E96;
            --border: #E9ECEF;
            --radius-lg: 24px;
            --radius-md: 16px;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.05);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #E5E7EB; 
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
        }

        .app-container { 
            width: 100%; 
            max-width: 480px; 
            background: var(--bg-color); 
            height: 100vh; 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            box-shadow: var(--shadow-lg);
        }

        header { 
            padding: 24px 20px 16px; 
            background: var(--surface); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 10; 
        }
        
        header h1 { 
            font-size: 1.5rem; 
            font-weight: 800; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            letter-spacing: -0.5px;
        }
        
        header h1 i { color: var(--primary); }

        .category-scroll { 
            display: flex; 
            overflow-x: auto; 
            padding: 0 20px 16px; 
            background: var(--surface); 
            gap: 10px; 
            scrollbar-width: none; 
            border-bottom: 1px solid var(--border); 
        }
        
        .category-scroll::-webkit-scrollbar { display: none; }
        
        .pill { 
            padding: 8px 16px; 
            background: var(--bg-color); 
            border-radius: 20px; 
            font-size: 0.85rem; 
            font-weight: 600; 
            color: var(--text-muted); 
            white-space: nowrap; 
            cursor: pointer; 
            border: 1px solid transparent; 
            transition: all 0.2s ease;
        }
        
        .pill.active { 
            background: var(--primary); 
            color: white; 
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
        }

        .recipe-feed { 
            flex: 1; 
            overflow-y: auto; 
            padding: 16px; 
            padding-bottom: 130px; /* Spazio per il FAB e la safe-area */
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 16px; 
            align-content: start;
        }

        .empty-state { 
            grid-column: 1 / -1; 
            text-align: center; 
            padding: 40px 20px; 
            color: var(--text-muted); 
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .empty-state i { font-size: 3.5rem; color: #DEE2E6; }

        .recipe-widget {
            background: var(--surface);
            border-radius: var(--radius-md);
            padding: 16px;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            aspect-ratio: 1; /* Rende la card quadrata */
            transition: transform 0.2s;
        }
        .recipe-widget:active { transform: scale(0.95); }
        
        .widget-title {
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1.3;
            /* Tronca il testo per non rompere il layout */
            display: -webkit-box;
            -webkit-line-clamp: 3; 
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--text-main);
        }

        .widget-badge {
            background: rgba(255, 107, 107, 0.1);
            color: var(--primary);
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            align-self: flex-start;
            margin-top: 12px;
        }

        /* FAB spostato a 90px dal basso per evitare l'intersezione con gesture bar */
        .fab { 
            position: absolute; 
            bottom: 90px; 
            right: 24px; 
            width: 64px; 
            height: 64px; 
            background: var(--primary); 
            color: white; 
            border-radius: 22px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 28px; 
            box-shadow: 0 8px 24px rgba(255, 107, 107, 0.4); 
            cursor: pointer; 
            border: none; 
            z-index: 20; 
            transition: transform 0.2s, background 0.2s;
        }
        .fab:active { transform: scale(0.9); background: var(--primary-dark); }

        .overlay { position: absolute; top:0;left:0;right:0;bottom:0; background: rgba(0,0,0,0.6); opacity: 0; pointer-events: none; transition: 0.3s; z-index: 30; backdrop-filter: blur(2px); }
        .overlay.active { opacity: 1; pointer-events: all; }
        
        /* Animazione dal basso (Bottom Sheet) */
        .sheet { position: absolute; bottom: 0; left: 0; right: 0; background: var(--bg-color); height: 92vh; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 40; display: flex; flex-direction: column; border-radius: 32px 32px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.1); }
        .sheet.active { transform: translateY(0); }
        
        /* Animazione laterale (Slide from right) */
        .detail-view { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-color); transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 50; display: flex; flex-direction: column; }
        .detail-view.active { transform: translateX(0); }
        
        .sheet-header, .detail-header { padding: 24px; background: var(--surface); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .sheet-header { border-radius: 32px 32px 0 0; }
        .sheet-content, .detail-content { padding: 24px; overflow-y: auto; flex: 1; }
        
        .form-control { width: 100%; padding: 16px; margin-bottom: 20px; border: 2px solid var(--border); border-radius: 16px; background: var(--surface); font-family: inherit; font-size: 1rem; color: var(--text-main); transition: 0.2s; }
        .form-control:focus { outline: none; border-color: var(--primary); }
        .time-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .btn-submit { width: 100%; padding: 18px; background: var(--text-main); color: white; border: none; border-radius: 16px; font-size: 1.1rem; font-weight: 700; margin-bottom: 40px; box-shadow: var(--shadow-sm); cursor: pointer; }
        .btn-submit:active { background: #1a1e24; }
        
        .detail-category { display: inline-block; padding: 6px 14px; background: rgba(255, 107, 107, 0.1); color: var(--primary); border-radius: 20px; font-size: 0.85rem; font-weight: 800; text-transform: uppercase; margin-bottom: 16px; }
        .detail-title { font-size: 2rem; font-weight: 800; margin-bottom: 24px; line-height: 1.2; }
        .time-banner { display: flex; justify-content: space-between; background: var(--surface); padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--border); margin-bottom: 32px; box-shadow: var(--shadow-sm); }
        .time-item { text-align: center; flex: 1; border-right: 1px solid var(--border); }
        .time-item:last-child { border-right: none; }
        .time-item span { display: block; font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 8px;}
        .time-item strong { font-size: 1.2rem; font-weight: 800; }
        
        .section-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .section-title i { color: var(--primary); font-size: 1.4rem; }
        .content-box { background: var(--surface); padding: 24px; border-radius: var(--radius-md); border: 1px solid var(--border); white-space: pre-wrap; margin-bottom: 32px; font-size: 1rem; line-height: 1.8; box-shadow: var(--shadow-sm); }
        
        .toast { position: absolute; top: 24px; left: 50%; transform: translate(-50%, -120px); background: var(--text-main); color: white; padding: 14px 28px; border-radius: 30px; font-weight: 600; font-size: 0.95rem; transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 100; display: flex; align-items: center; gap: 10px; width: max-content; box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
        .toast.show { transform: translate(-50%, 0); }
        
        .btn-icon-circular { background: var(--surface); border: 1px solid var(--border); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; color: var(--text-main); transition: 0.2s; }
        .btn-icon-circular.danger { background: rgba(255, 107, 107, 0.1); color: var(--primary); border-color: transparent; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="toast" class="toast"><i class="ri-checkbox-circle-fill" style="color:#4ADE80"></i> <span>Azione completata</span></div>

    <header>
        <h1><i class="ri-restaurant-fill"></i> ChefBox</h1>
    </header>

    <div class="category-scroll" id="category-filters">
        <div class="pill active" data-filter="All">Tutte le ricette</div>
    </div>

    <!-- WIDGET GRID A 2 COLONNE -->
    <main class="recipe-feed" id="recipe-feed"></main>

    <!-- FAB Aggiungi (Rialzato) -->
    <button class="fab" id="fab-add"><i class="ri-add-large-line"></i></button>

    <div class="overlay" id="overlay"></div>

    <!-- BOTTOM SHEET FORM -->
    <div class="sheet" id="add-sheet">
        <div class="sheet-header">
            <h3 style="font-size: 1.3rem; font-weight: 800;">Nuova Ricetta</h3>
            <button class="btn-icon-circular" style="width: 36px; height: 36px; border:none; background: var(--bg-color)" id="btn-close-sheet"><i class="ri-close-line"></i></button>
        </div>
        <div class="sheet-content">
            <form id="recipe-form">
                <input type="text" class="form-control" id="title" required placeholder="Titolo (Es. Pancake Soffici)">
                <select class="form-control" id="category" required>
                    <option value="" disabled selected>Scegli una categoria...</option>
                </select>
                <div class="time-grid">
                    <input type="number" class="form-control" id="timeTotal" required placeholder="Tot (m)" min="0">
                    <input type="number" class="form-control" id="timeLeav" placeholder="Liev (m)" min="0">
                    <input type="number" class="form-control" id="timeCook" placeholder="Cott (m)" min="0">
                </div>
                <textarea class="form-control" id="ingredients" required placeholder="Elenca gli ingredienti..." style="height:120px;"></textarea>
                <textarea class="form-control" id="procedure" required placeholder="Descrivi il procedimento passo dopo passo..." style="height:140px;"></textarea>
                <button type="submit" class="btn-submit">Salva nel Ricettario</button>
            </form>
        </div>
    </div>

    <!-- VISTA DETTAGLIO RICETTA -->
    <div class="detail-view" id="detail-view">
        <div class="detail-header">
            <button class="btn-icon-circular" id="btn-back"><i class="ri-arrow-left-line"></i></button>
            <button class="btn-icon-circular danger" id="btn-delete"><i class="ri-delete-bin-line"></i></button>
        </div>
        <div class="detail-content" id="detail-content">
            <!-- Dettagli iniettati via JS -->
        </div>
    </div>
</div>

<script>
    // --- PWA BLOB TRICK (Solo per Anteprima Singolo File) ---
    // Genera un manifest PWA a runtime
    const manifestJSON = {
        name: "ChefBox Ricettario",
        short_name: "ChefBox",
        display: "standalone",
        background_color: "#F8F9FA",
        theme_color: "#FF6B6B",
        icons: [{ src: "https://placehold.co/192x192/FF6B6B/FFFFFF?text=CB", sizes: "192x192", type: "image/png" }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifestJSON)], {type: 'application/json'});
    document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);

    // Dati e Categorie
    const Categorie = ["Antipasti", "Primi piatti", "Secondi piatti", "Contorni", "Dolci", "Lievitati salati", "Lievitati dolci", "Piatti unici", "Salse", "Zuppe", "Bevande", "Snack"];
    let recipes = JSON.parse(localStorage.getItem('chefbox_recipes')) || [];
    let currentId = null;

    // Elementi DOM
    const feed = document.getElementById('recipe-feed');
    const filters = document.getElementById('category-filters');
    const form = document.getElementById('recipe-form');
    const catSelect = document.getElementById('category');
    
    // Inizializzazione Categorie UI
    Categorie.forEach(cat => {
        catSelect.add(new Option(cat, cat));
        const pill = document.createElement('div');
        pill.className = 'pill'; 
        pill.innerText = cat;
        pill.onclick = () => {
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            pill.classList.add('active');
            renderFeed(cat);
        };
        filters.appendChild(pill);
    });

    document.querySelector('.pill').onclick = function() {
        document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
        this.classList.add('active'); 
        renderFeed('All');
    }

    // Logica Modali (Bottom Sheet e Detail Slide)
    document.getElementById('fab-add').onclick = () => { 
        document.getElementById('overlay').classList.add('active'); 
        document.getElementById('add-sheet').classList.add('active'); 
    }
    
    document.getElementById('btn-close-sheet').onclick = document.getElementById('overlay').onclick = () => { 
        document.getElementById('overlay').classList.remove('active'); 
        document.getElementById('add-sheet').classList.remove('active'); 
    }
    
    document.getElementById('btn-back').onclick = () => {
        document.getElementById('detail-view').classList.remove('active');
        resetDeleteButton();
    }

    // Salva nuova ricetta
    form.onsubmit = (e) => {
        e.preventDefault();
        recipes.unshift({
            id: 'r_' + Date.now(), 
            title: document.getElementById('title').value, 
            category: document.getElementById('category').value,
            timeTotal: document.getElementById('timeTotal').value, 
            timeLeav: document.getElementById('timeLeav').value || '0', 
            timeCook: document.getElementById('timeCook').value || '0',
            ingredients: document.getElementById('ingredients').value, 
            procedure: document.getElementById('procedure').value
        });
        localStorage.setItem('chefbox_recipes', JSON.stringify(recipes));
        form.reset(); 
        document.getElementById('btn-close-sheet').click();
        document.querySelector('.pill').click(); // Ritorna a "Tutte"
        showToast('Ricetta aggiunta!', true);
    };

    function renderFeed(filter = 'All') {
        feed.innerHTML = '';
        const filtered = filter === 'All' ? recipes : recipes.filter(r => r.category === filter);
        
        if(filtered.length === 0) {
            feed.innerHTML = `
                <div class="empty-state">
                    <i class="ri-book-3-line"></i>
                    <h3 style="font-weight:700;">Nessuna ricetta qui</h3>
                    <p style="font-size: 0.9rem;">Tocca il pulsante in basso per aggiungere la tua prima ricetta.</p>
                </div>`;
            return;
        }
        
        filtered.forEach(r => {
            const widget = document.createElement('div');
            widget.className = 'recipe-widget'; 
            widget.onclick = () => openRecipe(r.id);
            widget.innerHTML = `
                <div class="widget-title">${r.title}</div>
                <div class="widget-badge"><i class="ri-timer-line"></i> ${r.timeTotal}m</div>
            `;
            feed.appendChild(widget);
        });
    }

    function openRecipe(id) {
        const r = recipes.find(rec => rec.id === id);
        currentId = id;
        document.getElementById('detail-content').innerHTML = `
            <div class="detail-category">${r.category}</div>
            <h2 class="detail-title">${r.title}</h2>
            
            <div class="time-banner">
                <div class="time-item"><span>Totale</span><strong>${r.timeTotal}m</strong></div>
                <div class="time-item"><span>Lievitaz.</span><strong>${r.timeLeav}m</strong></div>
                <div class="time-item"><span>Cottura</span><strong>${r.timeCook}m</strong></div>
            </div>
            
            <div class="section-title"><i class="ri-shopping-basket-fill"></i> Ingredienti</div>
            <div class="content-box">${r.ingredients}</div>
            
            <div class="section-title"><i class="ri-list-check-3"></i> Procedimento</div>
            <div class="content-box">${r.procedure}</div>
        `;
        document.getElementById('detail-view').classList.add('active');
        resetDeleteButton();
    }

    // Eliminazione con doppio step (Safety First)
    const btnDel = document.getElementById('btn-delete');
    
    function resetDeleteButton() {
        btnDel.classList.remove('confirm');
        btnDel.innerHTML = '<i class="ri-delete-bin-line"></i>';
        btnDel.style.background = 'rgba(255, 107, 107, 0.1)';
        btnDel.style.color = 'var(--primary)';
    }

    btnDel.onclick = () => {
        if(!btnDel.classList.contains('confirm')) {
            // Primo Tap: Richiede Conferma Visiva
            btnDel.classList.add('confirm');
            btnDel.innerHTML = '<i class="ri-error-warning-fill"></i>';
            btnDel.style.background = 'var(--primary)';
            btnDel.style.color = 'white';
            setTimeout(resetDeleteButton, 3500); // Reset automatico
        } else {
            // Secondo Tap: Elimina
            recipes = recipes.filter(r => r.id !== currentId);
            localStorage.setItem('chefbox_recipes', JSON.stringify(recipes));
            document.getElementById('btn-back').click();
            renderFeed(document.querySelector('.pill.active').innerText === 'Tutte le ricette' ? 'All' : document.querySelector('.pill.active').innerText);
            showToast('Ricetta eliminata', false);
        }
    };

    function showToast(msg, success = true) {
        const t = document.getElementById('toast');
        t.querySelector('span').innerText = msg;
        const icon = t.querySelector('i');
        icon.className = success ? 'ri-checkbox-circle-fill' : 'ri-delete-bin-fill';
        icon.style.color = success ? '#4ADE80' : '#FF6B6B';
        
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3500);
    }

    // Inizia Rendering Iniziale
    renderFeed();
</script>
</body>
</html>
