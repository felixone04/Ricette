<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ChefBox - Ricettario</title>
    
    <meta name="theme-color" content="#F97316">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #F97316; 
            --primary-dark: #EA580C;
            --primary-light: rgba(249, 115, 22, 0.1);
            --bg-color: #FFF7ED; 
            --surface: #FFFFFF;
            --text-main: #1C1917;
            --text-muted: #78716C;
            --border: #FED7AA;
            --radius-md: 12px;
            --shadow-sm: 0 4px 12px rgba(249, 115, 22, 0.05);
            --safe-bottom: env(safe-area-inset-bottom, 30px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #E5E7EB; color: var(--text-main); display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        .app-container { width: 100%; max-width: 480px; background: var(--bg-color); height: 100vh; position: relative; display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER */
        header { padding: calc(24px + env(safe-area-inset-top, 0)) 20px 16px; background: var(--surface); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        header h1 { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .kitchen-icon { width: 26px; height: 26px; display: inline-block; }
        .header-actions { display: flex; gap: 12px; }
        .btn-icon { background: var(--bg-color); border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; color: var(--primary); transition: 0.2s; }
        
        /* FILTRI */
        .category-scroll { display: flex; overflow-x: auto; padding: 0 20px 16px; background: var(--surface); gap: 10px; scrollbar-width: none; border-bottom: 1px solid var(--border); }
        .category-scroll::-webkit-scrollbar { display: none; }
        .pill { padding: 8px 16px; background: var(--bg-color); border-radius: 20px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); white-space: nowrap; cursor: pointer; border: 1px solid transparent; transition: all 0.2s;}
        .pill.active { background: var(--primary); color: white; }

        /* WIDGET GRID (Home) */
        .recipe-feed { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: calc(140px + var(--safe-bottom)); display: grid; grid-template-columns: repeat(2, 1fr); grid-auto-rows: max-content; gap: 12px; align-content: start; }
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 3rem; color: #FDBA74; }
        .recipe-widget { background: var(--surface); border-radius: var(--radius-md); padding: 14px; box-shadow: var(--shadow-sm); cursor: pointer; border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; min-height: 70px; transition: transform 0.2s; gap: 6px; }
        .recipe-widget:active { transform: scale(0.96); }
        .widget-title { font-size: 0.95rem; font-weight: 700; line-height: 1.3; width: 100%; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .widget-badge { background: var(--primary-light); color: var(--primary-dark); padding: 4px 8px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }

        /* FAB ALZATO E SICURO */
        .fab { position: absolute; bottom: calc(40px + var(--safe-bottom)); right: 24px; width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(249, 115, 22, 0.4); cursor: pointer; border: none; z-index: 20; transition: transform 0.2s; }
        
        /* MODALS & BOTTOM SHEETS */
        .overlay { position: absolute; top:0;left:0;right:0;bottom:0; background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: 0.3s; z-index: 30; }
        .overlay.active { opacity: 1; pointer-events: all; }
        .sheet, .detail-view { position: absolute; bottom: 0; left: 0; right: 0; background: var(--bg-color); height: 92vh; transform: translateY(100%); transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 40; display: flex; flex-direction: column; border-radius: 24px 24px 0 0;}
        .sheet.active { transform: translateY(0); }
        .detail-view { height: 100vh; transform: translateX(100%); border-radius: 0; z-index: 50;}
        .detail-view.active { transform: translateX(0); }
        .sheet-header, .detail-header { padding: 20px; background: var(--surface); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); border-radius: 24px 24px 0 0;}
        .detail-header { border-radius: 0; }
        .sheet-content, .detail-content { padding: 20px; padding-bottom: calc(150px + var(--safe-bottom)); overflow-y: auto; flex: 1; }
        
        /* FORM E INPUTS */
        .form-group { margin-bottom: 16px; background: var(--surface); padding: 12px; border-radius: 12px; border: 1px solid var(--border); }
        .form-label { display: block; font-size: 0.85rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #E5E7EB; border-radius: 8px; background: var(--bg-color); font-family: inherit; font-size: 1rem; color: var(--text-main);}
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
        textarea.form-control { resize: vertical; min-height: 80px; }

        .time-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; display: none; }
        .time-grid.active { display: grid; }
        .time-grid-item label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 600;}

        .btn-submit { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 1.1rem; margin-bottom: 10px; cursor: pointer; display:flex; justify-content:center; align-items:center; gap:8px;}
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        
        /* INGREDIENT BUILDER */
        .ing-labels { display: flex; gap: 6px; font-size: 0.75rem; color: var(--text-muted); font-weight: 600; margin-bottom: 4px; padding: 0 4px;}
        .ing-row { display: flex; gap: 6px; margin-bottom: 12px; }
        .ing-row input, .ing-row select { padding: 10px 8px; }
        .ing-row .btn-add-ing { background: var(--text-main); color: white; border: none; border-radius: 8px; width: 48px; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; cursor: pointer;}
        
        .cat-list { list-style: none; margin-bottom: 10px; }
        .cat-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: var(--bg-color); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; font-weight: 600; font-size:0.9rem;}
        .btn-del-cat { background: rgba(239, 68, 68, 0.1); color: #EF4444; border: none; padding: 6px 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        /* DETTAGLI RICETTA & SERVINGS */
        .detail-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 20px; line-height: 1.2;}
        .time-banner { display: flex; justify-content: space-around; background: var(--surface); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border); margin-bottom: 20px;}
        .time-item span { display: block; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;}
        .time-item strong { font-size: 1.1rem; }
        
        .servings-stepper { display: flex; align-items: center; justify-content: space-between; background: var(--primary-light); padding: 12px 16px; border-radius: var(--radius-md); margin-bottom: 12px; border: 1px solid var(--border);}
        .servings-stepper span { font-weight: 700; color: var(--primary-dark); font-size: 0.95rem;}
        .stepper-controls { display: flex; align-items: center; gap: 8px; }
        .stepper-btn { background: var(--surface); border: 1px solid var(--primary); color: var(--primary); width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer;}
        .stepper-input { width: 45px; text-align: center; border: none; background: transparent; font-weight: 800; font-size: 1.1rem; color: var(--primary-dark); font-family: inherit;}
        
        .content-box { background: var(--surface); padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--border); white-space: pre-wrap; margin-bottom: 20px; line-height: 1.6;}
        .ing-display-list { list-style: none; background: var(--surface); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border); margin-bottom: 20px; }
        .ing-display-list li { padding: 8px 0; border-bottom: 1px dashed var(--border); display: flex; gap: 8px;}
        .ing-display-list li:last-child { border-bottom: none; padding-bottom: 0;}
        .ing-display-list li strong { color: var(--primary-dark); white-space: nowrap;}
        
        /* NOTIFICHE E TOGGLE */
        .toast { position: absolute; top: 20px; left: 50%; transform: translate(-50%, -100px); background: var(--text-main); color: white; padding: 12px 24px; border-radius: 30px; font-weight: 600; transition: 0.3s; z-index: 100; display: flex; align-items: center; gap: 8px; width:max-content;}
        .toast.show { transform: translate(-50%, 0); }

        .checkbox-container { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; color: var(--text-main); font-size: 0.95rem; }
        .checkbox-container input { width: 20px; height: 20px; accent-color: var(--primary); }
    </style>
</head>
<body>

<script>
    const iconSVG = `data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="1em" font-size="80">🍳</text></svg>`;
    const manifest = { name: "ChefBox", short_name: "ChefBox", display: "standalone", start_url: ".", background_color: "#FFF7ED", theme_color: "#F97316", icons: [{ src: iconSVG, sizes: "192x192", type: "image/svg+xml" }] };
    const manifestLink = document.createElement('link'); manifestLink.rel = 'manifest'; manifestLink.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest)); document.head.appendChild(manifestLink);
</script>

<div class="app-container">
    <div id="toast" class="toast"><i class="ri-check-line"></i> <span id="toast-msg">Completato</span></div>

    <header>
        <h1><img src='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="1em" font-size="80">🍳</text></svg>' class="kitchen-icon" alt="ChefBox"> ChefBox</h1>
        <div class="header-actions">
            <button class="btn-icon" id="btn-open-settings"><i class="ri-settings-3-fill"></i></button>
        </div>
    </header>

    <div class="category-scroll" id="category-filters">
        <!-- Generato via JS -->
    </div>

    <!-- FEED RICETTE -->
    <main class="recipe-feed" id="recipe-feed"></main>

    <!-- FAB -->
    <button class="fab" id="fab-add">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
    </button>

    <div class="overlay" id="overlay"></div>
    <datalist id="db-ingredients"></datalist>

    <!-- SHEET: Form Inserimento / Modifica (DEBUGGATO E CON TITOLI CHIARI) -->
    <div class="sheet" id="add-sheet">
        <div class="sheet-header">
            <h3 style="font-size: 1.2rem;" id="form-title">Nuova Ricetta</h3>
            <button class="btn-icon" style="color:var(--text-muted)" id="btn-close-sheet"><i class="ri-close-line"></i></button>
        </div>
        <div class="sheet-content">
            
            <form id="recipe-form">
                
                <div class="form-group">
                    <label class="form-label" for="title">Nome della Ricetta</label>
                    <input type="text" class="form-control" id="title" required placeholder="Es. Pasta alla Carbonara">
                </div>

                <div class="form-group">
                    <label class="form-label" for="category">Categoria</label>
                    <select class="form-control" id="category" required></select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="servings">Per quante persone?</label>
                    <input type="number" class="form-control" id="servings" required placeholder="Es. 4" min="0.5" step="0.5">
                </div>

                <!-- SEZIONE TEMPI (OPZIONALE E A SCOMPARSA) -->
                <div class="form-group">
                    <label class="checkbox-container">
                        <input type="checkbox" id="toggle-times">
                        ⏱️ Aggiungi Tempi (Opzionale)
                    </label>
                    
                    <div class="time-grid" id="time-grid-container">
                        <div class="time-grid-item">
                            <label for="timeTotal">Totale (min)</label>
                            <input type="number" class="form-control" id="timeTotal" placeholder="Es. 40">
                        </div>
                        <div class="time-grid-item">
                            <label for="timeLeav">Lievitazione</label>
                            <input type="number" class="form-control" id="timeLeav" placeholder="Es. 120">
                        </div>
                        <div class="time-grid-item">
                            <label for="timeCook">Cottura</label>
                            <input type="number" class="form-control" id="timeCook" placeholder="Es. 15">
                        </div>
                    </div>
                </div>
                
                <!-- SEZIONE INGREDIENTI (CON TITOLI) -->
                <div class="form-group">
                    <label class="form-label">Ingredienti (Aggiungi uno alla volta)</label>
                    
                    <div class="ing-labels">
                        <span style="flex:2;">Prodotto</span>
                        <span style="flex:1;">Quantità</span>
                        <span style="flex:1;">Unità</span>
                        <span style="width:48px;"></span>
                    </div>
                    
                    <div class="ing-row">
                        <input type="text" class="form-control" id="ing-name" list="db-ingredients" placeholder="Es. Farina" style="flex:2;">
                        <input type="number" step="0.1" class="form-control" id="ing-qty" placeholder="Es. 200" style="flex:1; padding-right:2px;">
                        <select class="form-control" id="ing-unit" style="flex:1; padding-left:4px; padding-right:4px;">
                            <option value="g">g</option><option value="kg">kg</option>
                            <option value="ml">ml</option><option value="l">l</option>
                            <option value="pz">pz</option><option value="q.b.">q.b.</option><option value="">-</option>
                        </select>
                        <button type="button" class="btn-add-ing" id="btn-add-ing"><i class="ri-add-line"></i></button>
                    </div>
                    
                    <!-- Lista ingredienti aggiunti -->
                    <ul class="cat-list" id="current-ing-list"></ul>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="procedure">Procedimento passo passo</label>
                    <textarea class="form-control" id="procedure" required placeholder="1. Taglia a cubetti...&#10;2. Metti in padella..."></textarea>
                </div>
                
                <button type="submit" class="btn-submit" id="btn-save-recipe"><i class="ri-save-3-line"></i> Salva Ricetta</button>
            </form>
        </div>
    </div>

    <!-- SHEET: Impostazioni -->
    <div class="sheet" id="settings-sheet">
        <div class="sheet-header">
            <h3 style="font-size: 1.2rem;">Impostazioni</h3>
            <button class="btn-icon" style="color:var(--text-muted)" id="btn-close-settings"><i class="ri-close-line"></i></button>
        </div>
        <div class="sheet-content">
            <div class="form-group">
                <label class="form-label">Database Ingredienti veloci</label>
                <div style="display:flex; gap:8px; margin-bottom:10px;">
                    <input type="text" class="form-control" id="new-prod-name" placeholder="Nuovo prodotto..." style="margin-bottom:0;">
                    <button type="button" class="btn-submit" id="btn-add-prod" style="width:auto; margin:0; padding:14px 20px;">+</button>
                </div>
                <div style="max-height: 200px; overflow-y:auto;"><ul class="cat-list" id="prod-list-ui"></ul></div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Gestisci Categorie</label>
                <div style="display:flex; gap:8px; margin-bottom:10px;">
                    <input type="text" class="form-control" id="new-cat-name" placeholder="Nuova categoria..." style="margin-bottom:0;">
                    <button type="button" class="btn-submit" id="btn-add-cat" style="width:auto; margin:0; padding:14px 20px;">+</button>
                </div>
                <div style="max-height: 200px; overflow-y:auto;"><ul class="cat-list" id="cat-list-ui"></ul></div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Backup dei Dati</label>
                <button type="button" class="btn-submit btn-outline" id="btn-export" style="margin-bottom:10px;"><i class="ri-download-2-line"></i> Scarica Backup (.json)</button>
                <label for="file-import" class="btn-submit btn-outline" style="cursor:pointer; text-align:center;"><i class="ri-upload-2-line"></i> Ripristina da file</label>
                <input type="file" id="file-import" accept=".json" style="display:none;">
            </div>
        </div>
    </div>

    <!-- DETAIL VIEW (Lettura) -->
    <div class="detail-view" id="detail-view">
        <div class="detail-header">
            <button type="button" style="background:none;border:none;font-size:1.8rem;cursor:pointer;color:var(--text-main);" id="btn-back"><i class="ri-arrow-left-s-line"></i></button>
            <div style="display:flex; gap:12px;">
                <button type="button" style="background:rgba(249,115,22,0.1);color:var(--primary);border:none;width:40px;height:40px;border-radius:50%;cursor:pointer;" id="btn-edit"><i class="ri-pencil-line"></i></button>
                <button type="button" style="background:rgba(239,68,68,0.1);color:#EF4444;border:none;width:40px;height:40px;border-radius:50%;cursor:pointer;" id="btn-delete"><i class="ri-delete-bin-line"></i></button>
            </div>
        </div>
        <div class="detail-content" id="detail-content"></div>
    </div>
</div>

<script>
    let defaultCats = ["Antipasti", "Primi", "Secondi", "Contorni", "Dolci", "Lievitati", "Salse", "Bevande"];
    let defaultProds = ["Farina 00", "Zucchero", "Uova", "Latte", "Burro", "Sale", "Olio EVO", "Lievito", "Aglio", "Cipolla"];
    
    let categories = JSON.parse(localStorage.getItem('chefbox_cats')) || defaultCats;
    let productsDB = JSON.parse(localStorage.getItem('chefbox_products')) || defaultProds;
    let recipes = JSON.parse(localStorage.getItem('chefbox_recipes_v5')) || JSON.parse(localStorage.getItem('chefbox_recipes_v4')) || [];
    
    let currentRecipeId = null;
    let isEditing = false;
    let activeIngredients = []; 
    let currentBaseServings = 1;
    let currentTargetServings = 1;
    let currentDetailIngredients = [];

    const feed = document.getElementById('recipe-feed'), filters = document.getElementById('category-filters'), catSelect = document.getElementById('category');
    
    // --- GESTIONE SCHERMATE (MODALS E BACK) ---
    function openModal(id) { document.getElementById(id).classList.add('active'); if(id.includes('sheet')) document.getElementById('overlay').classList.add('active'); history.pushState({ modal: id }, "", `#${id}`); }
    function closeAllModals() { document.querySelectorAll('.sheet, .detail-view, .overlay').forEach(el => el.classList.remove('active')); }
    window.addEventListener('popstate', (e) => { closeAllModals(); if (e.state && e.state.modal) { document.getElementById(e.state.modal).classList.add('active'); if(e.state.modal.includes('sheet')) document.getElementById('overlay').classList.add('active'); }});
    const triggerBack = () => history.back();
    document.getElementById('btn-close-sheet').onclick = document.getElementById('btn-close-settings').onclick = document.getElementById('btn-back').onclick = document.getElementById('overlay').onclick = triggerBack;
    document.getElementById('btn-open-settings').onclick = () => openModal('settings-sheet');
    
    // --- TOGGLE TEMPI ---
    document.getElementById('toggle-times').addEventListener('change', function() {
        document.getElementById('time-grid-container').classList.toggle('active', this.checked);
        if(!this.checked) {
            document.getElementById('timeTotal').value = '';
            document.getElementById('timeLeav').value = '';
            document.getElementById('timeCook').value = '';
        }
    });

    // --- DB PRODOTTI ---
    function renderProducts() {
        const datalist = document.getElementById('db-ingredients'); const prodUI = document.getElementById('prod-list-ui');
        datalist.innerHTML = ''; prodUI.innerHTML = '';
        productsDB.sort((a,b) => a.localeCompare(b)).forEach(p => {
            datalist.appendChild(new Option(p, p));
            const li = document.createElement('li'); li.className = 'cat-item'; li.innerHTML = `<span>${p}</span>`;
            const delBtn = document.createElement('button'); delBtn.className = 'btn-del-cat'; delBtn.type="button"; delBtn.innerHTML = '<i class="ri-delete-bin-line"></i>';
            delBtn.onclick = () => { productsDB = productsDB.filter(x => x !== p); saveProducts(); };
            li.appendChild(delBtn); prodUI.appendChild(li);
        });
    }
    function saveProducts() { localStorage.setItem('chefbox_products', JSON.stringify(productsDB)); renderProducts(); }
    document.getElementById('btn-add-prod').onclick = () => {
        const val = document.getElementById('new-prod-name').value.trim();
        if(val && !productsDB.map(v=>v.toLowerCase()).includes(val.toLowerCase())) { productsDB.push(val); saveProducts(); document.getElementById('new-prod-name').value = ''; showToast('Prodotto aggiunto'); }
    };
    function autoAddProduct(name) { if(name && !productsDB.map(v=>v.toLowerCase()).includes(name.toLowerCase())) { productsDB.push(name); saveProducts(); } }

    // --- COSTRUTTORE INGREDIENTI ---
    function renderActiveIngredients() {
        const ul = document.getElementById('current-ing-list'); ul.innerHTML = '';
        activeIngredients.forEach((ing, index) => {
            const li = document.createElement('li'); li.className = 'cat-item'; li.style.padding = '8px 12px';
            li.innerHTML = `<span><strong>${ing.qty} ${ing.unit}</strong> ${ing.name}</span>`;
            const del = document.createElement('button'); del.className = 'btn-del-cat'; del.type="button"; del.style.padding = '4px 8px'; del.innerHTML = '<i class="ri-close-line"></i>';
            del.onclick = () => { activeIngredients.splice(index, 1); renderActiveIngredients(); };
            li.appendChild(del); ul.appendChild(li);
        });
    }
    document.getElementById('btn-add-ing').onclick = () => {
        const name = document.getElementById('ing-name').value.trim();
        const qty = document.getElementById('ing-qty').value.replace(',', '.').trim();
        const unit = document.getElementById('ing-unit').value;
        if(!name) return showToast("Inserisci il nome del prodotto!");
        activeIngredients.push({ name, qty, unit }); autoAddProduct(name);
        document.getElementById('ing-name').value = ''; document.getElementById('ing-qty').value = ''; document.getElementById('ing-name').focus();
        renderActiveIngredients();
    };

    // Previene submit se premo Invio sull'input degli ingredienti
    document.getElementById('ing-name').addEventListener('keypress', function(e){ if(e.key === 'Enter') { e.preventDefault(); document.getElementById('btn-add-ing').click(); }});
    document.getElementById('ing-qty').addEventListener('keypress', function(e){ if(e.key === 'Enter') { e.preventDefault(); document.getElementById('btn-add-ing').click(); }});

    // --- SALVATAGGIO RICETTA ---
    document.getElementById('fab-add').onclick = () => {
        isEditing = false; document.getElementById('form-title').innerText = "Nuova Ricetta"; document.getElementById('recipe-form').reset();
        document.getElementById('servings').value = 4;
        document.getElementById('toggle-times').checked = false;
        document.getElementById('time-grid-container').classList.remove('active');
        activeIngredients = []; renderActiveIngredients(); openModal('add-sheet');
    };

    document.getElementById('recipe-form').onsubmit = (e) => {
        e.preventDefault();
        const pendName = document.getElementById('ing-name').value; if(pendName) document.getElementById('btn-add-ing').click();
        if(activeIngredients.length === 0) { alert("Attenzione: Aggiungi almeno un ingrediente cliccando sul tasto '+' nella riga apposita."); return; }

        const recData = {
            id: isEditing ? currentRecipeId : ('r_' + Date.now()), 
            title: document.getElementById('title').value, 
            category: document.getElementById('category').value,
            servings: parseFloat(document.getElementById('servings').value) || 1,
            timeTotal: document.getElementById('timeTotal').value, 
            timeLeav: document.getElementById('timeLeav').value, 
            timeCook: document.getElementById('timeCook').value,
            ingredients: activeIngredients, 
            procedure: document.getElementById('procedure').value
        };

        if(isEditing) {
            recipes[recipes.findIndex(r => r.id === currentRecipeId)] = recData;
            openRecipe(currentRecipeId); showToast('Ricetta modificata!');
        } else { recipes.unshift(recData); showToast('Ricetta salvata!'); }
        
        localStorage.setItem('chefbox_recipes_v5', JSON.stringify(recipes));
        triggerBack(); renderFeed(document.querySelector('.pill.active').innerText === 'Tutte' ? 'All' : document.querySelector('.pill.active').innerText);
    };

    // --- FEED RICETTE ---
    function renderFeed(filter = 'All') {
        feed.innerHTML = '';
        const filtered = filter === 'All' ? recipes : recipes.filter(r => r.category === filter);
        if(filtered.length === 0) return feed.innerHTML = `<div class="empty-state"><i class="ri-book-3-line"></i><br><span style="margin-top:10px; display:block;">Nessuna ricetta trovata.</span></div>`;
        
        filtered.forEach(r => {
            const div = document.createElement('div'); div.className = 'recipe-widget'; div.onclick = () => openRecipe(r.id);
            const badgeHtml = r.timeTotal ? `<div class="widget-badge"><i class="ri-time-line"></i> ${r.timeTotal}m</div>` : '';
            div.innerHTML = `<div class="widget-title">${r.title}</div>${badgeHtml}`; feed.appendChild(div);
        });
    }

    // --- RICALCOLO PORZIONI ---
    function renderDetailIngredientsHTML() {
        const ratio = currentTargetServings / currentBaseServings;
        let html = `<ul class="ing-display-list">`;
        currentDetailIngredients.forEach(i => {
            let displayQty = i.qty;
            if(displayQty && displayQty !== '') {
                let parsed = parseFloat(displayQty);
                if(!isNaN(parsed)) displayQty = +(parsed * ratio).toFixed(2);
            }
            html += `<li><strong>${displayQty} ${i.unit}</strong> ${i.name}</li>`;
        });
        html += `</ul>`;
        document.getElementById('dynamic-ingredients-box').innerHTML = html;
    }

    function changeServings(delta) {
        let newVal = currentTargetServings + delta; if(newVal < 0.5) newVal = 0.5;
        currentTargetServings = newVal; document.getElementById('detail-servings').value = currentTargetServings;
        renderDetailIngredientsHTML();
    }

    // --- LETTURA RICETTA ---
    function openRecipe(id) {
        const r = recipes.find(rec => rec.id === id); currentRecipeId = id;
        currentBaseServings = r.servings || 1; currentTargetServings = currentBaseServings;
        currentDetailIngredients = Array.isArray(r.ingredients) ? r.ingredients : [];

        let timeBannerHtml = '';
        if(r.timeTotal || r.timeLeav || r.timeCook) {
            timeBannerHtml = `<div class="time-banner">`;
            if(r.timeTotal) timeBannerHtml += `<div class="time-item"><span>Totale</span><strong>${r.timeTotal}m</strong></div>`;
            if(r.timeLeav) timeBannerHtml += `<div class="time-item"><span>Lievitaz.</span><strong>${r.timeLeav}m</strong></div>`;
            if(r.timeCook) timeBannerHtml += `<div class="time-item"><span>Cottura</span><strong>${r.timeCook}m</strong></div>`;
            timeBannerHtml += `</div>`;
        }

        document.getElementById('detail-content').innerHTML = `
            <div style="color:var(--primary); font-weight:bold; font-size:0.9rem; margin-bottom:10px; letter-spacing:0.5px; text-transform:uppercase;">${r.category}</div>
            <h2 class="detail-title">${r.title}</h2>
            ${timeBannerHtml}
            <div class="servings-stepper">
                <span>Porzioni</span>
                <div class="stepper-controls">
                    <button type="button" class="stepper-btn" onclick="changeServings(-0.5)">-</button>
                    <input type="number" id="detail-servings" class="stepper-input" step="0.5" min="0.5" value="${currentTargetServings}">
                    <button type="button" class="stepper-btn" onclick="changeServings(0.5)">+</button>
                </div>
            </div>
            <div id="dynamic-ingredients-box"></div>
            <h3 style="margin-bottom:12px; display:flex; align-items:center; gap:8px;"><i class="ri-list-check-2" style="color:var(--primary)"></i> Procedimento</h3>
            <div class="content-box">${r.procedure}</div>
        `;
        
        if(currentDetailIngredients.length > 0) renderDetailIngredientsHTML();
        else document.getElementById('dynamic-ingredients-box').innerHTML = `<div class="content-box">Ricetta senza formato ingredienti aggiornato. Clicca Modifica per aggiornarla.</div>`;

        document.getElementById('detail-servings').addEventListener('input', (e) => {
            let val = parseFloat(e.target.value); if(val && val >= 0.5) { currentTargetServings = val; renderDetailIngredientsHTML(); }
        });
        if(!document.getElementById('detail-view').classList.contains('active')) openModal('detail-view');
    }

    // --- MODIFICA / ELIMINA ---
    document.getElementById('btn-edit').onclick = () => {
        const r = recipes.find(rec => rec.id === currentRecipeId); isEditing = true; document.getElementById('form-title').innerText = "Modifica Ricetta";
        document.getElementById('title').value = r.title; document.getElementById('category').value = r.category;
        document.getElementById('servings').value = r.servings || 1;
        document.getElementById('timeTotal').value = r.timeTotal || ''; document.getElementById('timeLeav').value = r.timeLeav || ''; document.getElementById('timeCook').value = r.timeCook || '';
        document.getElementById('procedure').value = r.procedure;
        
        // Attiva o disattiva il blocco tempi se ci sono valori
        const hasTimes = (r.timeTotal || r.timeLeav || r.timeCook);
        document.getElementById('toggle-times').checked = hasTimes;
        document.getElementById('time-grid-container').classList.toggle('active', hasTimes);

        activeIngredients = Array.isArray(r.ingredients) ? [...r.ingredients] : []; renderActiveIngredients();
        openModal('add-sheet'); 
    };

    document.getElementById('btn-delete').onclick = () => {
        if(confirm("Sei sicuro di eliminare questa ricetta definitivamente?")) { recipes = recipes.filter(r => r.id !== currentRecipeId); localStorage.setItem('chefbox_recipes_v5', JSON.stringify(recipes)); triggerBack(); renderFeed(document.querySelector('.pill.active').innerText === 'Tutte' ? 'All' : document.querySelector('.pill.active').innerText); showToast('Ricetta eliminata'); }
    };

    // --- CATEGORIE ED EXPORT ---
    document.getElementById('btn-export').onclick = () => {
        const dlAnchor = document.createElement('a'); dlAnchor.setAttribute("href", "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(recipes)));
        dlAnchor.setAttribute("download", "chefbox_backup.json"); dlAnchor.click(); showToast("Backup scaricato!");
    };
    document.getElementById('file-import').onchange = (e) => {
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            try { const importedRecipes = JSON.parse(event.target.result); if(Array.isArray(importedRecipes)) {
                    const existingIds = new Set(recipes.map(r => r.id)); importedRecipes.forEach(r => { if(!existingIds.has(r.id)) recipes.push(r); });
                    localStorage.setItem('chefbox_recipes_v5', JSON.stringify(recipes)); triggerBack(); renderFeed('All'); showToast("Ricette importate!");
                }
            } catch(err) { alert("Errore file. Assicurati sia un backup valido in JSON."); }
        }; reader.readAsText(file);
    };

    function renderCategories() {
        filters.innerHTML = '<div class="pill active" data-filter="All">Tutte</div>'; catSelect.innerHTML = '<option value="" disabled selected>Scegli Categoria...</option>'; document.getElementById('cat-list-ui').innerHTML = '';
        categories.forEach(cat => {
            catSelect.add(new Option(cat, cat));
            const pill = document.createElement('div'); pill.className = 'pill'; pill.innerText = cat;
            pill.onclick = () => { document.querySelectorAll('.pill').forEach(p => p.classList.remove('active')); pill.classList.add('active'); renderFeed(cat); }; filters.appendChild(pill);
            const li = document.createElement('li'); li.className = 'cat-item'; li.innerHTML = `<span>${cat}</span>`;
            const delBtn = document.createElement('button'); delBtn.className = 'btn-del-cat'; delBtn.type="button"; delBtn.innerHTML = '<i class="ri-delete-bin-line"></i>';
            delBtn.onclick = () => {
                const count = recipes.filter(r => r.category === cat).length;
                if(count > 0 && !delBtn.classList.contains('confirming')) { delBtn.classList.add('confirming'); delBtn.innerHTML = 'Elimina ' + count + ' ricette?'; setTimeout(() => { delBtn.classList.remove('confirming'); delBtn.innerHTML = '<i class="ri-delete-bin-line"></i>'; }, 3000); return; }
                else if(count > 0) { recipes = recipes.filter(r => r.category !== cat); localStorage.setItem('chefbox_recipes_v5', JSON.stringify(recipes)); renderFeed('All'); }
                categories = categories.filter(c => c !== cat); localStorage.setItem('chefbox_cats', JSON.stringify(categories)); renderCategories(); showToast('Categoria rimossa');
            }; li.appendChild(delBtn); document.getElementById('cat-list-ui').appendChild(li);
        });
        filters.firstElementChild.onclick = function() { document.querySelectorAll('.pill').forEach(p => p.classList.remove('active')); this.classList.add('active'); renderFeed('All'); }
    }
    document.getElementById('btn-add-cat').onclick = () => { const val = document.getElementById('new-cat-name').value.trim(); if(val && !categories.includes(val)) { categories.push(val); localStorage.setItem('chefbox_cats', JSON.stringify(categories)); document.getElementById('new-cat-name').value = ''; renderCategories(); showToast('Categoria aggiunta!'); }};
    function showToast(msg) { const t = document.getElementById('toast'); document.getElementById('toast-msg').innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }

    // Start
    renderCategories(); renderProducts(); renderFeed();
</script>
</body>
</html>
